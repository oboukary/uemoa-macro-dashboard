name: CI/CD — UEMOA Macro Dashboard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: uemoa-macro-dashboard

jobs:
  # 1) Contrôles Python : dépendances, compilation, smoke test des imports
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall app

      - name: Smoke test (imports + chargement catalogue)
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          from utils.config import load_indicators
          from utils.countries import UEMOA_ISO3
          from data import extract_worldbank, extract_imf, extract_fred  # noqa: F401
          inds = load_indicators()
          assert len(inds) >= 8, "catalogue d'indicateurs incomplet"
          assert len(UEMOA_ISO3) == 8, "il doit y avoir 8 pays UEMOA"
          print(f"OK — {len(inds)} indicateurs, {len(UEMOA_ISO3)} pays")
          PY

  # 2) Build (et publication GHCR sur main) de l'image Docker
  docker:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
